name: rick_morty
description: A new Flutter project.


publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ">=2.17.6 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  google_fonts: ^6.3.0
  flutter_modular: ^6.3.4
  build_runner: ^2.4.6
  equatable: ^2.0.7
  dio: ^5.9.0
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.1.0
  shimmer: ^3.0.0
  lottie: ^3.1.3
  mockito: ^5.4.4
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  
